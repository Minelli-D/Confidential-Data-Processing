<text x="470" y="482" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#2E7D4F" text-anchor="start" xml:space="preserve">Built once, stored in S3 (L4)</text>
<text x="470" y="503" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">Same bytes -&gt; same PCR0 -&gt; the key policy never</text>
