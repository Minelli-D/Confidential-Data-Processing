<path d="M 330,558 L 330,422" fill="none" stroke="#6B7787" stroke-width="2.2" marker-end="url(#e6B7787)"/>
<path d="M 675,558 L 675,422" fill="none" stroke="#A86A12" stroke-width="2.2" marker-end="url(#eA86A12)" marker-start="url(#sA86A12)"/>
<circle cx="110" cy="445" r="13" fill="#1F2A44" stroke="#FFFFFF" stroke-width="2"/>
<text x="110" y="450" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">2</text>
<text x="130" y="450" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#1F2A44" text-anchor="start" xml:space="preserve">fetch ciphertext</text>
<circle cx="330" cy="445" r="13" fill="#1F2A44" stroke="#FFFFFF" stroke-width="2"/>
<text x="330" y="450" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">6</text>
<text x="350" y="450" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#1F2A44" text-anchor="start" xml:space="preserve">write encrypted result</text>
<circle cx="675" cy="445" r="13" fill="#A86A12" stroke="#FFFFFF" stroke-width="2"/>
<text x="675" y="450" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">4</text>
<text x="695" y="450" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#A86A12" text-anchor="start" xml:space="preserve">attest → get data key</text>
<path d="M 422,676 L 498,676" fill="none" stroke="#6B7787" stroke-width="2.2" marker-end="url(#e6B7787)" marker-start="url(#s6B7787)"/>
