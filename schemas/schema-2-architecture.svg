<path d="M 330,290 L 330,158" fill="none" stroke="#6B7787" stroke-width="2.2" marker-end="url(#e6B7787)"/>
<path d="M 675,156 L 675,288" fill="none" stroke="#A86A12" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#eA86A12)"/>
