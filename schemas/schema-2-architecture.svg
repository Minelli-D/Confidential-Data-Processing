<text x="110" y="181" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">1</text>
<text x="130" y="181" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#1F2A44" text-anchor="start" xml:space="preserve">upload, encrypted</text>
<circle cx="330" cy="176" r="13" fill="#1F2A44" stroke="#FFFFFF" stroke-width="2"/>
<text x="330" y="181" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">7</text>
<text x="350" y="181" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#1F2A44" text-anchor="start" xml:space="preserve">pull back, encrypted</text>
<circle cx="675" cy="176" r="13" fill="#A86A12" stroke="#FFFFFF" stroke-width="2"/>
<text x="675" y="181" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">A</text>
<text x="695" y="181" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#A86A12" text-anchor="start" xml:space="preserve">pin PCR0</text>
