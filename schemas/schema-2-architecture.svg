<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160">
<defs><marker id="e6B7787" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7787"/></marker><marker id="s6B7787" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#6B7787"/></marker><marker id="eA86A12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A86A12"/></marker><marker id="sA86A12" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#A86A12"/></marker></defs>
<rect width="900" height="1160" fill="#FFFFFF"/>
<rect x="20" y="12" width="22" height="16" rx="3" fill="#E2F2E8" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="50" y="25" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#5B6577" text-anchor="start" xml:space="preserve">plaintext (enclave only)</text>
<rect x="232" y="12" width="22" height="16" rx="3" fill="#F1F3F6" stroke="#6B7787" stroke-width="1.5"/>
<text x="262" y="25" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#5B6577" text-anchor="start" xml:space="preserve">ciphertext only</text>
<rect x="392" y="12" width="22" height="16" rx="3" fill="#FCF0D9" stroke="#A86A12" stroke-width="1.5"/>
<text x="422" y="25" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#5B6577" text-anchor="start" xml:space="preserve">keys / KMS</text>
<rect x="532" y="12" width="22" height="16" rx="3" fill="#FFFFFF" stroke="#A86A12" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="562" y="25" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#5B6577" text-anchor="start" xml:space="preserve">set-up step, once per build</text>
<rect x="20" y="52" width="380" height="104" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.8"/>
<text x="210" y="82" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#1F2A44" text-anchor="middle" xml:space="preserve">Data source</text>
<text x="210" y="103" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">on-prem · app · database</text>
<text x="210" y="124" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">owns the plaintext, encrypts it with a data key</text>
<rect x="470" y="52" width="410" height="104" rx="8" fill="#FCF0D9" stroke="#A86A12" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="675" y="82" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" fill="#A86A12" text-anchor="middle" xml:space="preserve">A · PREPARE (CI, once per build)</text>
<text x="675" y="103" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">Build the enclave image → measure PCR0 →</text>
<text x="675" y="124" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">pin PCR0 in the KMS key policy (Terraform)</text>
<rect x="10" y="196" width="880" height="956" rx="14" fill="none" stroke="#1F2A44" stroke-width="1.8"/>
<text x="874" y="220" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#1F2A44" text-anchor="end" xml:space="preserve">AWS ACCOUNT</text>
<rect x="30" y="232" width="840" height="848" rx="12" fill="#F7F9FC" stroke="#1F4E79" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="450" y="1068" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="middle" xml:space="preserve">VPC  ·  private subnets only  ·  no internet, no NAT gateway</text>
<rect x="50" y="470" width="800" height="570" rx="12" fill="none" stroke="#1F4E79" stroke-width="1.5"/>
<text x="450" y="1028" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#1F4E79" text-anchor="middle" xml:space="preserve">EKS CLUSTER  (plus a small system node group, not drawn)</text>
<rect x="70" y="505" width="760" height="495" rx="10" fill="#FFFFFF" stroke="#6B7787" stroke-width="1.5"/>
<text x="450" y="988" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#6B7787" text-anchor="middle" xml:space="preserve">ENCLAVE NODE  ·  m6a.xlarge  ·  enclave_options = enabled  ·  Spot, scales to zero</text>
<rect x="60" y="290" width="340" height="130" rx="8" fill="#F1F3F6" stroke="#6B7787" stroke-width="1.8"/>
<text x="230" y="318" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#1F2A44" text-anchor="middle" xml:space="preserve">Amazon S3</text>
<text x="230" y="341" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">SSE-KMS + S3 Bucket Keys</text>
<text x="230" y="364" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">policy: TLS only, VPC endpoint only</text>
<text x="230" y="387" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#6B7787" text-anchor="middle" xml:space="preserve">holds ciphertext only</text>
<rect x="500" y="290" width="340" height="130" rx="8" fill="#FCF0D9" stroke="#A86A12" stroke-width="1.8"/>
<text x="670" y="318" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#A86A12" text-anchor="middle" xml:space="preserve">AWS KMS  (the gatekeeper)</text>
<text x="670" y="341" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">reached through an interface endpoint</text>
<text x="670" y="364" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">releases the data key only if the</text>
<text x="670" y="387" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">attestation shows the approved PCR0</text>
<rect x="90" y="560" width="330" height="240" rx="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.8"/>
<text x="255" y="600" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#1F2A44" text-anchor="middle" xml:space="preserve">Job pod (parent)</text>
<text x="255" y="624" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">a courier: moves bytes in and out,</text>
<text x="255" y="648" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">runs the vsock-proxy for KMS calls</text>
<text x="255" y="672" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">asks for the enclave device + hugepages</text>
<text x="255" y="696" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve"></text>
<text x="255" y="720" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#6B7787" text-anchor="middle" xml:space="preserve">sees ciphertext only</text>
<rect x="500" y="560" width="310" height="240" rx="8" fill="#E2F2E8" stroke="#2E7D4F" stroke-width="2.2"/>
<text x="655" y="600" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#2E7D4F" text-anchor="middle" xml:space="preserve">Nitro Enclave</text>
<text x="655" y="624" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">no disk · no network · no SSH</text>
<circle cx="560" cy="676" r="13" fill="#2E7D4F" stroke="#FFFFFF" stroke-width="2"/>
<text x="560" y="681" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">5</text>
<text x="667" y="672" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">decrypt → process</text>
<text x="667" y="693" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">→ re-encrypt</text>
<text x="655" y="760" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#2E7D4F" text-anchor="middle" xml:space="preserve">plaintext lives ONLY here</text>
<rect x="90" y="830" width="720" height="120" rx="8" fill="#FFFFFF" stroke="#6B7787" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="122" cy="862" r="13" fill="#6B7787" stroke="#FFFFFF" stroke-width="2"/>
<text x="122" y="867" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">8</text>
<text x="146" y="867" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#1F2A44" text-anchor="start" xml:space="preserve">SHRED  ·  when the job ends</text>
<text x="146" y="896" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">the enclave memory is wiped · the data keys are gone · the node group</text>
<text x="146" y="918" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">scales to zero · temporary S3 objects expire → nothing usable is left</text>
<rect x="30" y="1094" width="840" height="46" rx="8" fill="#F1F3F6" stroke="#6B7787" stroke-width="1"/>
<text x="450" y="1123" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">CloudTrail logs every KMS and S3 call  ·  CloudWatch alarms  ·  AWS Budgets</text>
