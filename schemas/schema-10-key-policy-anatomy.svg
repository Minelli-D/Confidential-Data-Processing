<rect x="506" y="430" width="378" height="64" rx="8" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="522" y="454" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#1F2A44" text-anchor="start" xml:space="preserve">Instance role, OUR enclave</text>
<text x="522" y="476" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5B6577" text-anchor="start" xml:space="preserve">attestation + PCR0 match</text>
<rect x="782" y="444" width="88" height="28" rx="14" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="1"/>
