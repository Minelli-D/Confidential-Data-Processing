<text x="826" y="192" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#B23A2E" text-anchor="middle" xml:space="preserve">test B1</text>
<rect x="506" y="208" width="378" height="64" rx="8" fill="#FFFFFF" stroke="#B23A2E" stroke-width="1.5"/>
<text x="522" y="232" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#1F2A44" text-anchor="start" xml:space="preserve">Instance role, debug-mode enclave</text>
<text x="522" y="254" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5B6577" text-anchor="start" xml:space="preserve">PCR0 = all zeros</text>
