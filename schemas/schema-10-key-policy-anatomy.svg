<text x="826" y="488" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="11" font-weight="700" fill="#2E7D4F" text-anchor="middle" xml:space="preserve">step L6</text>
<rect x="16" y="590" width="868" height="56" rx="10" fill="#E3EDF7" stroke="#1F4E79" stroke-width="1.4"/>
<text x="450" y="613" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">As deployed (AWS-11): principal ':root' means the whole account through IAM. IAM admins can manage</text>
<text x="450" y="633" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="middle" xml:space="preserve">and encrypt, and could rewrite the policy (CloudTrail logs it), but nobody gets Decrypt without the enclave.</text>
