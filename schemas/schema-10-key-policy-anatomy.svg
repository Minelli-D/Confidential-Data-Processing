<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660">
<defs></defs>
<rect width="900" height="660" fill="#FFFFFF"/>
<rect x="16" y="14" width="470" height="560" rx="12" fill="#FBFCFD" stroke="#A86A12" stroke-width="1.8"/>
<text x="32" y="40" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#A86A12" text-anchor="start" xml:space="preserve">Key policy of alias/confidential-poc</text>
<text x="32" y="60" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#5B6577" text-anchor="start" xml:space="preserve">default deny: anything not allowed below is refused</text>
<rect x="32" y="76" width="438" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
<rect x="32" y="76" width="6" height="110" rx="3" fill="#1F4E79"/>
<text x="48" y="99" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="start" xml:space="preserve">1 · KeyAdministrationNoDecrypt</text>
<text x="48" y="120" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">Principal: you (as deployed: account root, AWS-11)</text>
<text x="48" y="139" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">Actions: Create*, Describe*, Put*, Update*,</text>
<text x="48" y="158" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">Get*, List*, ScheduleKeyDeletion, …</text>
<text x="48" y="177" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#B23A2E" text-anchor="start" xml:space="preserve">NO Decrypt</text>
<rect x="32" y="200" width="438" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.6"/>
<rect x="32" y="200" width="6" height="110" rx="3" fill="#1F4E79"/>
<text x="48" y="223" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#1F4E79" text-anchor="start" xml:space="preserve">2 · DataOwnerEncryptOnly</text>
<text x="48" y="244" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">Principal: you (same as above)</text>
<text x="48" y="263" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">Actions: GenerateDataKey, Encrypt,</text>
<text x="48" y="282" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">DescribeKey</text>
<text x="48" y="301" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#B23A2E" text-anchor="start" xml:space="preserve">NO Decrypt</text>
<rect x="32" y="324" width="438" height="129" rx="8" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.6"/>
<rect x="32" y="324" width="6" height="129" rx="3" fill="#2E7D4F"/>
<text x="48" y="347" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#2E7D4F" text-anchor="start" xml:space="preserve">3 · EnclaveDecryptOnlyWithAttestation</text>
<text x="48" y="368" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">Principal: role/confidential-poc-instance</text>
<text x="48" y="387" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">Action: kms:Decrypt only</text>
<text x="48" y="406" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">Condition: StringEqualsIgnoreCase</text>
<text x="48" y="425" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="400" fill="#1F2A44" text-anchor="start" xml:space="preserve">kms:RecipientAttestation:ImageSha384</text>
<text x="48" y="444" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#1F2A44" text-anchor="start" xml:space="preserve">= PCR0 (96 hex characters)</text>
<text x="32" y="566" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="12" font-weight="400" fill="#5B6577" text-anchor="start" xml:space="preserve">Statement 3 exists only after the image is built (first session, step L5).</text>
<text x="516" y="40" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#1F2A44" text-anchor="start" xml:space="preserve">Who asks for Decrypt, and what KMS answers</text>
